<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121318;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #2b2b2b 0%, #0d0d0d 100%);
      overflow: hidden;
    }
    /* Proporção protegida contra esticamento no modo Paisagem / Desktop */
    canvas {
      display: block;
      width: min(100vw, calc(100dvh * (854 / 480)));
      height: auto;
      max-width: 960px;
      aspect-ratio: 854 / 480;
      background: #3888e8;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
      image-rendering: pixelated;
    }
    /* Botões de Topo (Sprite, Tela Cheia e Áudio) */
    .top-controls {
      position: absolute;
      top: 12px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    .icon-btn {
      height: 38px;
      padding: 0 12px;
      background: rgba(0, 0, 0, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      color: #ffd700;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }
    .icon-btn:active {
      transform: scale(0.92);
    }
    #spriteInput {
      display: none;
    }
    /* Controles no Modo Paisagem (Flutuantes nas laterais, mais elevados) */
    .touch-controls {
      position: absolute;
      bottom: 12%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      pointer-events: none;
      max-width: 960px;
      margin: 0 auto;
      z-index: 15;
    }
    .d-pad, .action-buttons {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .btn {
      width: 66px;
      height: 66px;
      background: rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(4px);
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 24px;
      text-shadow: 1px 2px 3px rgba(0,0,0,0.8);
      touch-action: none;
      box-shadow: 0 5px 12px rgba(0,0,0,0.45);
      transition: transform 0.08s, background 0.08s;
    }
    .btn.pressed, .btn:active {
      background: rgba(255, 215, 0, 0.78);
      transform: scale(0.9);
      border-color: #ffd700;
    }
    #jumpBtn {
      width: 78px;
      height: 78px;
      font-size: 16px;
      letter-spacing: 0.5px;
      background: rgba(230, 45, 45, 0.65);
      border-color: #fff;
    }
    #jumpBtn.pressed, #jumpBtn:active {
      background: rgba(255, 90, 90, 0.88);
    }

       AJUSTE EXCLUSIVO PARA CELULAR EM MODO RETRATO (EM PÉ)
       ===================================================== */
    @media (orientation: portrait) {
      #game-container {
        justify-content: flex-start;
        padding-top: 56px;
        background: linear-gradient(180deg, #15171e 0%, #202430 60%, #15171e 100%);
      }
      canvas {
        width: 96vw;
        height: auto;
        aspect-ratio: 540 / 480;
        border: 3px solid #3c4254;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
      }
      /* Coloca os controles logo abaixo da tela, na posição natural dos polegares */
      .touch-controls {
        position: relative;
        bottom: auto;
        width: 96vw;
        margin-top: 28px;
        padding: 22px 24px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.35);
      }
      .d-pad {
        gap: 18px;
      }
      .btn {
        width: 74px;
        height: 74px;
        font-size: 28px;
        background: rgba(255, 255, 255, 0.18);
      }

        width: 88px;
        height: 88px;
        font-size: 18px;
        background: rgba(230, 45, 45, 0.75);
      }
    }
  </style>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// =========================================================
// ADAPTAÇÃO DE TELA (RETRATO vs PAISAGEM SEM ESTICAR PIXELS)
// =========================================================
function resizeViewport() {
  const isPortrait = window.innerHeight > window.innerWidth;
  // Em modo retrato usamos 540x480 (mais amplo verticalmente e sem distorção); em paisagem 854x480 (16:9)
  const targetWidth = isPortrait ? 540 : 854;
  if (canvas.width !== targetWidth) {
    canvas.width = targetWidth;
    canvas.height = 480;
  }
}
window.addEventListener("resize", resizeViewport);
window.addEventListener("orientationchange", resizeViewport);
resizeViewport();

// Botão de Tela Cheia
document.getElementById("fsBtn").addEventListener("click", () => {
  const docEl = document.documentElement;
  if (!document.fullscreenElement) {
    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
});

// =========================================================
// CARREGADOR E PROCESSADOR INTELIGENTE DO SPRITESHEET (6 FRAMES)
// =========================================================
let spriteData = null;

function processSpritesheet(img, saveToCache = false) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  if (!w || !h) return;

  const offCanvas = document.createElement("canvas");
  offCanvas.width = w;
  offCanvas.height = h;
  const offCtx = offCanvas.getContext("2d");
  offCtx.drawImage(img, 0, 0);

  try {
    const imgData = offCtx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const visited = new Uint8Array(w * h);
    const queue = new Int32Array(w * h);
    let qHead = 0, qTail = 0;

    const isBgColor = (idx) => {
      const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
      return a < 25 || (r < 30 && g < 30 && b < 30);
    };

    const pushIfBg = (x, y) => {
      const pos = y * w + x;
      if (!visited[pos] && isBgColor(pos * 4)) {
        visited[pos] = 1;
        queue[qTail++] = pos;
      }
    };

    for (let x = 0; x < w; x++) {
      pushIfBg(x, 0);
      pushIfBg(x, h - 1);
    }
    for (let y = 0; y < h; y++) {
      pushIfBg(0, y);
      pushIfBg(w - 1, y);
    }

    while (qHead < qTail) {
      const pos = queue[qHead++];
      data[pos * 4 + 3] = 0;

      const x = pos % w;
      const y = (pos / w) | 0;
      if (x > 0) pushIfBg(x - 1, y);
      if (x < w - 1) pushIfBg(x + 1, y);
      if (y > 0) pushIfBg(x, y - 1);
      if (y < h - 1) pushIfBg(x, y + 1);
    }

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const pos = y * w + x;
        const idx = pos * 4;
        if (data[idx + 3] > 0 && data[idx] < 22 && data[idx + 1] < 22 && data[idx + 2] < 22) {
          if (visited[pos - 1] || visited[pos + 1] || visited[pos - w] || visited[pos + w]) {
            data[idx + 3] = 0;
          }
        }
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    const colCounts = new Int32Array(w);
    for (let x = 0; x < w; x++) {
      let count = 0;
      for (let y = 0; y < h; y++) {
        if (data[(y * w + x) * 4 + 3] > 35) count++;
      }
      colCounts[x] = count;
    }

    const segments = [];
    let inSeg = false, startX = 0;
    const minSpriteWidth = w / 30;

    for (let x = 0; x < w; x++) {
      if (colCounts[x] > 3 && !inSeg) {
        inSeg = true;
        startX = x;
      } else if (colCounts[x] <= 3 && inSeg) {
        inSeg = false;
        if (x - startX >= minSpriteWidth) {
          segments.push({ startX, endX: x - 1 });
        } else {
          offCtx.clearRect(startX, 0, x - startX, h);
        }
      }
    }
    if (inSeg && (w - startX) >= minSpriteWidth) {
      segments.push({ startX, endX: w - 1 });
    }

    const rawSegments = segments.length === 6
      ? segments
      : Array.from({ length: 6 }, (_, i) => ({
          startX: Math.floor(i * (w / 6) + (w / 6) * 0.14),
          endX: Math.floor((i + 1) * (w / 6) - (w / 6) * 0.08)
        }));

    const frames = rawSegments.map(seg => {
      let minY = h, maxY = 0;
      for (let y = 0; y < h; y++) {
        for (let x = seg.startX; x <= seg.endX; x++) {
          if (data[(y * w + x) * 4 + 3] > 35) {
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (minY >= maxY) { minY = 0; maxY = h - 1; }
      return {
        sx: seg.startX,
        sy: minY,
        sw: seg.endX - seg.startX + 1,
        sh: maxY - minY + 1
      };
    });

    spriteData = { sheet: offCanvas, frames };

    if (saveToCache) {
      try {
        localStorage.setItem("william_spritesheet_v1", offCanvas.toDataURL("image/png"));
      } catch (err) {}
    }
  } catch (secErr) {
    const cellW = w / 6;
    const frames = Array.from({ length: 6 }, (_, i) => ({
      sx: Math.floor(i * cellW + cellW * 0.15),
      sy: Math.floor(h * 0.06),
      sw: Math.floor(cellW * 0.72),
      sh: Math.floor(h * 0.88)
    }));
    spriteData = { sheet: img, frames };
  }
}

function autoLoadSpritesheet() {
  const cached = localStorage.getItem("william_spritesheet_v1");
  if (cached) {
    const img = new Image();
    img.onload = () => processSpritesheet(img, false);
    img.src = cached;
  }

  const candidateFiles = ["47102.png", "spritesheet.png", "william.png"];
  let idx = 0;
  const tryNext = () => {
    if (idx >= candidateFiles.length) return;
    const testImg = new Image();
    testImg.onload = () => processSpritesheet(testImg, true);
    testImg.onerror = tryNext;
    testImg.src = candidateFiles[idx++];
  };
  tryNext();
}
autoLoadSpritesheet();

function handleFileSelect(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      processSpritesheet(img, true);
      addFloatingText("SPRITE CARREGADO!", william.x - 20, william.y - 15, "#00e676");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById("spriteInput").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
});

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    handleFileSelect(e.dataTransfer.files[0]);
  }
});

// ==========================================
// SISTEMA DE ÁUDIO 16-BITS (Web Audio API)
// ==========================================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

document.getElementById("muteBtn").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  document.getElementById("muteBtn").textContent = soundEnabled ? "🔊" : "🔇";
  initAudio();
});

function playSound(type) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;

  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === "jump") {
    osc.type = "square";
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.16);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
    osc.start(now);
    osc.stop(now + 0.16);
  } else if (type === "ring") {
    osc.type = "sine";
    osc.frequency.setValueAtTime(987.77, now);
    osc.frequency.setValueAtTime(1318.51, now + 0.06);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.008, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === "stomp") {
    osc.type = "triangle";
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
    osc.start(now);
    osc.stop(now + 0.12);
  } else if (type === "spring") {
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(750, now + 0.25);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
    osc.start(now);
    osc.stop(now + 0.25);
  } else if (type === "hurt") {
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(450, now);
    osc.frequency.linearRampToValueAtTime(160, now + 0.3);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === "checkpoint") {
    osc.type = "square";
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(783.99, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now);
    osc.stop(now + 0.25);
  } else if (type === "win") {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "triangle";
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(freq, now + idx * 0.11);
      g.gain.setValueAtTime(0.16, now + idx * 0.11);
      g.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.11 + 0.35);
      o.start(now + idx * 0.11);
      o.stop(now + idx * 0.11 + 0.35);
    });
  } else if (type === "gameover") {
    const notes = [392.0, 349.23, 329.63, 261.63];
    notes.forEach((freq, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sawtooth";
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(freq, now + idx * 0.16);
      g.gain.setValueAtTime(0.12, now + idx * 0.16);
      g.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.16 + 0.3);
      o.start(now + idx * 0.16);
      o.stop(now + idx * 0.16 + 0.3);
    });
  }
}

// ==========================================
// CONTROLES (Teclado + Mobile Touch)
// ==========================================
const keys = { left: false, right: false, up: false, upJustPressed: false };

function setKey(keyName, value) {
  if (keyName === "up" && value && !keys.up) {
    keys.upJustPressed = true;
  }
  keys[keyName] = value;
}

window.addEventListener("keydown", (e) => {
  initAudio();
  if (e.code === "ArrowLeft" || e.code === "KeyA") setKey("left", true);
  if (e.code === "ArrowRight" || e.code === "KeyD") setKey("right", true);
  if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") {
    e.preventDefault();
    setKey("up", true);
  }
});

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") setKey("left", false);
  if (e.code === "ArrowRight" || e.code === "KeyD") setKey("right", false);
  if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") setKey("up", false);
});

function bindTouch(id, keyName) {
  const el = document.getElementById(id);
  const press = (e) => {
    e.preventDefault();
    initAudio();
    el.classList.add("pressed");
    setKey(keyName, true);
  };
  const release = (e) => {
    e.preventDefault();
    el.classList.remove("pressed");
    setKey(keyName, false);
  };
  el.addEventListener("touchstart", press, { passive: false });
  el.addEventListener("touchend", release, { passive: false });
  el.addEventListener("touchcancel", release, { passive: false });
  el.addEventListener("mousedown", press);
  el.addEventListener("mouseup", release);
  el.addEventListener("mouseleave", release);
}
bindTouch("leftBtn", "left");
bindTouch("rightBtn", "right");
bindTouch("jumpBtn", "up");

canvas.addEventListener("pointerdown", () => {
  initAudio();
  if ((gameOver || gameWon) && endScreenTimer > 35) {
    resetGame(gameWon);
  }
});

];
let enemies = [];

const goal = { x: 2860, y: 270, w: 50, h: 130, spinSpeed: 0, angle: 0 };

function initEntities(fullReset = true) {
  if (fullReset) {
    rings = initialRings.map(r => ({ x: r.x, y: r.y, r: 11, collected: false }));
    checkpoint.active = false;
    spawnPoint = { x: 60, y: 300 };
    score = 0;
  }
  enemies = initialEnemies.map(e => ({ ...e, alive: true }));
  droppedRings = [];
  particles = [];
  floatingTexts = [];
  goal.spinSpeed = 0;
  goal.angle = 0;
}
initEntities(true);

function spawnParticles(x, y, color, count = 8, speed = 3.5) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const spd = (0.4 + Math.random() * 0.8) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1,
      life: 1,
      decay: 0.025 + Math.random() * 0.02,
      size: 3 + Math.random() * 4,
      color
    });
  }
}

function addFloatingText(text, x, y, color = "#ffd700") {
  floatingTexts.push({ text, x, y, vy: -1.5, life: 1, color });
}

function scatterRings(x, y, count) {
  const toDrop = Math.min(count, 12);
  for (let i = 0; i < toDrop; i++) {
    const angle = -Math.PI * 0.15 - (Math.PI * 0.7 * (i / Math.max(1, toDrop - 1)));
    const spd = 4.5 + (i % 3) * 1.8;
    droppedRings.push({
      x, y: y - 10,
      vx: Math.cos(angle) * spd + (Math.random() - 0.5),
      vy: Math.sin(angle) * spd - 2,
      r: 10,
      life: 260,
      pickupDelay: 32
    });
  }
}

// =========================================================
// RENDERIZAÇÃO DO WILLIAM (SPRITESHEET + FALLBACK PIXEL ART)
// =========================================================
function drawWilliam(ctx, w, time) {
  if (w.invulnTimer > 0 && Math.floor(w.invulnTimer / 4) % 2 === 0) return;

  const screenX = w.x - camera.x;

  if (spriteData && spriteData.frames.length === 6) {
    let frameIdx = 1;
    const speedAbs = Math.abs(w.vx);

    if (!w.grounded) {
      frameIdx = w.vy < 0 ? 0 : 3;
    } else if (speedAbs > 0.35) {
  const runFrames = [2, 5, 4, 5];
  frameIdx = runFrames[Math.floor(w.animFrame) % runFrames.length];
}

    const f = spriteData.frames[frameIdx];

    ctx.save();
    ctx.translate(screenX + w.width / 2, w.y + w.height);
    if (w.facing === -1) ctx.scale(-1, 1);

    let breathScaleY = 1;
    if (w.hurtTimer > 0) {
      ctx.rotate(-0.22);
    } else if (w.grounded && speedAbs <= 0.35) {
      breathScaleY = 1 + Math.sin(time * 0.005) * 0.02;
    }
    ctx.scale(1, breathScaleY);

    ctx.imageSmoothingEnabled = false;

    const aspect = f.sw / f.sh;
    const drawH = w.drawHeight;
    const drawW = drawH * aspect;

    ctx.drawImage(
      spriteData.sheet,
      f.sx, f.sy, f.sw, f.sh,
      -drawW / 2, -drawH + 2, drawW, drawH
    );

    ctx.restore();
    return;
  }

  // Fallback vetorial caso a imagem ainda não tenha sido carregada
  ctx.save();
  ctx.translate(screenX + w.width / 2, w.y + w.height / 2);
  if (w.facing === -1) ctx.scale(-1, 1);
  ctx.translate(-w.width / 2, -w.height / 2);

  ctx.lineWidth = 2.4;
  ctx.strokeStyle = "#111";

  const isMoving = Math.abs(w.vx) > 0.4;
  const legSwing = w.grounded ? (isMoving ? Math.sin(w.animFrame * 1.1) * 7 : 0) : 5;

  ctx.fillStyle = "#7c3f16";
  ctx.fillRect(9 - legSwing * 0.5, 50, 10, 14);
  ctx.strokeRect(9 - legSwing * 0.5, 50, 10, 14);
  ctx.fillStyle = "#964d1c";
  ctx.fillRect(16 + legSwing * 0.5, 50, 10, 14);
  ctx.strokeRect(16 + legSwing * 0.5, 50, 10, 14);

  ctx.fillStyle = "#0088ff";
  ctx.beginPath();
  ctx.roundRect(8, 30, 20, 22, 3);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#ffcca0";
  ctx.beginPath();
  ctx.moveTo(10, 15);
  ctx.lineTo(24, 15);
  ctx.lineTo(26, 19);
  ctx.quadraticCurveTo(38, 21, 34, 27.5);
  ctx.lineTo(25, 28.5);
  ctx.lineTo(25, 34);
  ctx.lineTo(11, 34);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(22.5, 21, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#381c0c";
  ctx.beginPath();
  ctx.ellipse(25.5, 29.5, 6, 2.5, -0.2, 0, Math.PI * 2);
  ctx.arc(15, 32.5, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(12, 13, 12.5, 0, Math.PI * 2);
  ctx.arc(5.5, 17.5, 8.5, 0, Math.PI * 2);
  ctx.arc(6.5, 25.5, 7.5, 0, Math.PI * 2);
  ctx.arc(17.5, 7.5, 8.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawBackground(time) {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  skyGrad.addColorStop(0, "#1c64d1");
  skyGrad.addColorStop(0.65, "#67b9f7");
  skyGrad.addColorStop(1, "#d4f0ff");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#1954a6";
  ctx.fillRect(0, 360, canvas.width, 120);
  ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
  for (let i = 0; i < 12; i++) {
    let shimmerX = ((i * 120 - camera.x * 0.1 + Math.sin(time * 0.003 + i) * 15) % canvas.width + canvas.width) % canvas.width;
    ctx.fillRect(shimmerX, 372 + (i % 3) * 14, 45, 3);
  }

  ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
  const cloudSpan = 1800;
  for (let i = 0; i < 7; i++) {
    let nx = ((i * 280 - camera.x * 0.18 - time * 0.01) % cloudSpan + cloudSpan) % cloudSpan - 120;
    let ny = 55 + (i % 3) * 28;
    ctx.beginPath();
    ctx.arc(nx, ny, 26, 0, Math.PI * 2);
    ctx.arc(nx + 32, ny - 10, 38, 0, Math.PI * 2);
    ctx.arc(nx + 68, ny, 26, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "#267d39";
  for (let i = -1; i < 9; i++) {
    let hx = i * 380 - (camera.x * 0.25) % 380;
    ctx.beginPath();
    ctx.ellipse(hx, 420, 240, 160, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "#32a84a";
  for (let i = -1; i < 9; i++) {
    let hx = i * 320 + 140 - (camera.x * 0.45) % 320;
    ctx.beginPath();
    ctx.ellipse(hx, 445, 190, 120, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < 12; i++) {
    let px = i * 380 + 130 - camera.x;
    if (px > -120 && px < canvas.width + 120) {
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(px, 405);
      ctx.quadraticCurveTo(px + 16, 310, px + 4, 235);
      ctx.stroke();

      ctx.fillStyle = "#5c3816";
      ctx.beginPath();
      ctx.arc(px + 1, 240, 5, 0, Math.PI * 2);
      ctx.arc(px + 9, 242, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#12ad3e";
      const sway = Math.sin(time * 0.002 + i) * 0.06;
      for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 3) {
        ctx.beginPath();
        const a = angle + sway;
        ctx.ellipse(
          px + 4 + Math.cos(a) * 34,
          235 + Math.sin(a) * 14,
          38, 11, a, 0, Math.PI * 2
        );
        ctx.fill();
      }
    }
  }
}

function drawPlatform(p) {
  let screenX = p.x - camera.x;
  if (screenX + p.w < 0 || screenX > canvas.width) return;

  const tileSize = 20;
  for (let y = 0; y < p.h; y += tileSize) {
    for (let x = 0; x < p.w; x += tileSize) {
      let isAlt = (Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0;
      ctx.fillStyle = isAlt ? "#b25329" : "#d8763d";
      let drawW = Math.min(tileSize, p.w - x);
      let drawH = Math.min(tileSize, p.h - y);
      ctx.fillRect(screenX + x, p.y + y, drawW, drawH);
    }
  }

  ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
  ctx.fillRect(screenX, p.y + 10, p.w, 6);

  ctx.fillStyle = "#22d63f";
  ctx.fillRect(screenX, p.y, p.w, 10);
  ctx.fillStyle = "#0ea827";
  for (let x = 0; x < p.w; x += 12) {
    ctx.beginPath();
    ctx.moveTo(screenX + x, p.y + 10);
    ctx.lineTo(screenX + x + 6, p.y + 18);
    ctx.lineTo(screenX + Math.min(x + 12, p.w), p.y + 10);
    ctx.fill();
  }
}

function drawSprings() {
  springs.forEach(s => {
    let sx = s.x - camera.x;
    if (sx < -50 || sx > canvas.width + 50) return;

    const stretch = s.bounceAnim > 0 ? Math.sin(s.bounceAnim * 0.8) * 10 : 0;
    ctx.fillStyle = "#777";
    ctx.fillRect(sx + 4, s.y + 8, s.w - 8, 8);

    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx + 8, s.y + 8);
    ctx.lineTo(sx + s.w - 8, s.y + 2 - stretch * 0.5);
    ctx.lineTo(sx + 8, s.y - stretch);
    ctx.stroke();

    ctx.fillStyle = "#e52521";
    ctx.beginPath();
    ctx.roundRect(sx, s.y - 4 - stretch, s.w, 8, 4);
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

function drawCheckpoint(time) {
  let cx = checkpoint.x - camera.x;
  if (cx < -50 || cx > canvas.width + 50) return;

  ctx.fillStyle = "#ddd";
  ctx.fillRect(cx + 9, checkpoint.y, 6, checkpoint.h);
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  ctx.strokeRect(cx + 9, checkpoint.y, 6, checkpoint.h);

  ctx.fillStyle = checkpoint.active
    ? (Math.floor(time / 120) % 2 === 0 ? "#00e676" : "#29b6f6")
    : "#ff3d00";
  ctx.beginPath();
  ctx.arc(cx + 12, checkpoint.y - 4, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

function drawRings(time) {
  const renderRing = (rx, ry, radius, alpha = 1) => {
    if (rx < -30 || rx > canvas.width + 30) return;
    let spin = Math.sin(time * 0.007 + rx * 0.05);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(rx, ry);
    ctx.scale(Math.abs(spin) * 0.65 + 0.35, 1);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.lineWidth = 3.8;
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "#fff8b0";
    ctx.stroke();
    ctx.restore();
  };

  rings.forEach(r => {
    if (!r.collected) renderRing(r.x - camera.x, r.y, r.r, 1);
  });

  droppedRings.forEach(dr => {
    const alpha = dr.life < 60 ? (Math.floor(dr.life / 4) % 2 === 0 ? 0.3 : 0.9) : 1;
    renderRing(dr.x - camera.x, dr.y, dr.r, alpha);
  });
}

function drawEnemies(time) {
  enemies.forEach(en => {
    if (!en.alive) return;
    let ex = en.x - camera.x;
    if (ex < -60 || ex > canvas.width + 60) return;

    ctx.fillStyle = "#e52521";
    ctx.beginPath();
    ctx.arc(ex + en.w / 2, en.y + 15, 16, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#111";
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(ex + en.w / 2 - 4, en.y + 6, 6, 3, -0.3, 0, Math.PI * 2);
    ctx.fill();

    const dirOffset = en.vx > 0 ? 20 : 6;
    ctx.fillStyle = "#fff";
    ctx.fillRect(ex + dirOffset, en.y + 4, 9, 7);
    ctx.fillStyle = "#ffeb3b";
    ctx.fillRect(ex + (en.vx > 0 ? 25 : 6), en.y + 6, 4, 4);

    const wheelBounce = Math.sin(time * 0.02 + en.x) * 1.5;
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(ex + 9, en.y + 20 + wheelBounce, 6, 0, Math.PI * 2);
    ctx.arc(ex + en.w - 9, en.y + 20 - wheelBounce, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });
}

function drawGoal() {
  let gx = goal.x - camera.x;
  if (gx < -80 || gx > canvas.width + 80) return;

  ctx.fillStyle = "#ccc";
  ctx.fillRect(gx + 20, goal.y, 10, goal.h);
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 2;
  ctx.strokeRect(gx + 20, goal.y, 10, goal.h);

  ctx.save();
  ctx.translate(gx + 25, goal.y + 18);
  ctx.scale(Math.cos(goal.angle), 1);

  ctx.fillStyle = gameWon ? "#29b6f6" : "#ffcc00";
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#fff";
  ctx.stroke();

  ctx.fillStyle = "#111";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(gameWon ? "WILLIAM" : "GOAL", 0, 4);
  ctx.restore();
}

function drawParticlesAndTexts() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camera.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = "bold 16px sans-serif";
    ctx.fillStyle = "#000";
    ctx.fillText(ft.text, ft.x - camera.x + 1, ft.y + 1);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x - camera.x, ft.y);
    ctx.restore();
  });
}

function drawHUD(time) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
  ctx.beginPath();
  ctx.roundRect(14, 14, 210, 56, 8);
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
  ctx.lineWidth = 2;
  ctx.stroke();

  const ringEmptyFlash = ringsCollected === 0 && Math.floor(time / 250) % 2 === 0;
  ctx.fillStyle = ringEmptyFlash ? "#ff5252" : "#ffd700";
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText(`ANÉIS:  ${ringsCollected}`, 26, 37);

  ctx.fillStyle = "#ffffff";
  ctx.fillText(`SCORE:  ${score}`, 26, 58);

  if (gameOver) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 40px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 25);

    ctx.fillStyle = "#fff";
    ctx.font = "17px sans-serif";
    ctx.fillText(
      checkpoint.active ? "Toque ou pressione PULO para voltar ao Checkpoint" : "Toque ou pressione PULO para tentar novamente",
      canvas.width / 2,
      canvas.height / 2 + 25
    );
  }

  if (gameWon) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 34px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("FASE CONCLUÍDA!", canvas.width / 2, canvas.height / 2 - 45);

    ctx.fillStyle = "#fff";
    ctx.font = "18px sans-serif";
    ctx.fillText("William atravessou Green Hills com sucesso!", canvas.width / 2, canvas.height / 2 - 8);

    const finalBonus = score + ringsCollected * 100;
    ctx.fillStyle = "#00e676";
    ctx.font = "bold 19px monospace";
    ctx.fillText(`BÔNUS: ${ringsCollected * 100}  |  TOTAL: ${finalBonus}`, canvas.width / 2, canvas.height / 2 + 32);

    ctx.fillStyle = "#ccc";
    ctx.font = "16px sans-serif";
    ctx.fillText("Toque na tela ou pressione PULO para jogar de novo", canvas.width / 2, canvas.height / 2 + 74);
  }
}

function resetGame(fullReset = false) {
  initEntities(fullReset);
  william.x = spawnPoint.x;
  william.y = spawnPoint.y;
  william.vx = 0;
  william.vy = 0;
  william.grounded = false;
  william.invulnTimer = 0;
  william.hurtTimer = 0;
  william.animFrame = 0;
  ringsCollected = 0;
  gameOver = false;
  gameWon = false;
  endScreenTimer = 0;
  keys.upJustPressed = false;
}

// ==========================================
// LOOP PRINCIPAL (COM DELTA TIME NORMALIZADO)
// ==========================================
let lastTime = performance.now();

function update(time) {
  const rawDt = (time - lastTime) / 16.667;
  const dt = Math.min(rawDt, 2.5);
  lastTime = time;

  if (!gameOver && !gameWon) {
    if (william.invulnTimer > 0) william.invulnTimer -= dt;
    if (william.hurtTimer > 0) william.hurtTimer -= dt;
    if (william.coyoteTimer > 0) william.coyoteTimer -= dt;
    if (william.jumpBuffer > 0) william.jumpBuffer -= dt;

    if (keys.upJustPressed) {
      william.jumpBuffer = 7;
      keys.upJustPressed = false;
    }

    if (william.hurtTimer <= 0) {
      if (keys.left) {
        william.vx = Math.max(william.vx - william.accel * dt, -william.maxSpeed);
        william.facing = -1;
      } else if (keys.right) {
        william.vx = Math.min(william.vx + william.accel * dt, william.maxSpeed);
        william.facing = 1;
      } else {
        william.vx *= Math.pow(0.76, dt);
        if (Math.abs(william.vx) < 0.08) william.vx = 0;
      }
    }

    if (Math.abs(william.vx) > 0.35) {
      william.animFrame = (william.animFrame + Math.abs(william.vx) * 0.045 * dt) % 6;
    } else {
      william.animFrame = 1;
    }

    if (william.grounded && Math.abs(william.vx) > 4.2 && Math.random() < 0.3 * dt) {
      spawnParticles(william.x + william.width / 2, william.y + william.height, "rgba(255,255,255,0.7)", 1, 1.2);
    }

    if (william.jumpBuffer > 0 && william.coyoteTimer > 0 && william.hurtTimer <= 0) {
      william.vy = william.jumpStrength;
      william.grounded = false;
      william.coyoteTimer = 0;
      william.jumpBuffer = 0;
      playSound("jump");
      spawnParticles(william.x + william.width / 2, william.y + william.height, "#fff", 5, 2);
    }

    if (!keys.up && william.vy < -5.5 && william.hurtTimer <= 0) {
      william.vy *= Math.pow(0.85, dt);
    }

    william.vy = Math.min(william.vy + GRAVITY * dt, 15);

    const prevBottom = william.y + william.height;
    william.x += william.vx * dt;
    william.y += william.vy * dt;

    if (william.x < 0) {
      william.x = 0;
      william.vx = 0;
    }

    william.grounded = false;

    platforms.forEach(p => {
      const horizOverlap = william.x + william.width > p.x + 4 && william.x < p.x + p.w - 4;
      const newBottom = william.y + william.height;

      if (
        horizOverlap &&
        william.vy >= 0 &&
        prevBottom <= p.y + 10 &&
        newBottom >= p.y
      ) {
        william.grounded = true;
        william.coyoteTimer = 6;
        william.vy = 0;
        william.y = p.y - william.height;
      } else if (p.isGround && newBottom > p.y + 12 && william.y < p.y + p.h) {
        if (william.x + william.width > p.x && william.x < p.x && william.vx > 0) {
          william.x = p.x - william.width;
          william.vx = 0;
        } else if (william.x < p.x + p.w && william.x + william.width > p.x + p.w && william.vx < 0) {
          william.x = p.x + p.w;
          william.vx = 0;
        }
      }
    });

    springs.forEach(s => {
      if (s.bounceAnim > 0) s.bounceAnim = Math.max(0, s.bounceAnim - 0.35 * dt);
      if (
        william.x + william.width > s.x &&
        william.x < s.x + s.w &&
        william.y + william.height >= s.y - 4 &&
        william.y + william.height <= s.y + s.h + 10 &&
        william.vy >= 0
      ) {
        william.vy = s.power;
        william.grounded = false;
        william.coyoteTimer = 0;
        s.bounceAnim = 10;
        playSound("spring");
        spawnParticles(s.x + s.w / 2, s.y, "#ffd700", 10, 3.5);
      }
    });

    if (
      !checkpoint.active &&
      william.x + william.width > checkpoint.x &&
      william.x < checkpoint.x + checkpoint.w &&
      william.y + william.height > checkpoint.y
    ) {
      checkpoint.active = true;
      spawnPoint = { x: checkpoint.x - 10, y: checkpoint.y - 10 };
      playSound("checkpoint");
      spawnParticles(checkpoint.x + 12, checkpoint.y, "#00e676", 14, 4);
      addFloatingText("CHECKPOINT!", checkpoint.x - 25, checkpoint.y - 15, "#00e676");
    }

    enemies.forEach(en => {
      if (!en.alive) return;
      en.x += en.vx * dt;
      if (en.x <= en.minX) {
        en.x = en.minX;
        en.vx = Math.abs(en.vx);
      } else if (en.x >= en.maxX) {
        en.x = en.maxX;
        en.vx = -Math.abs(en.vx);
      }

      if (
        william.x + william.width - 4 > en.x &&
        william.x + 4 < en.x + en.w &&
        william.y + william.height > en.y &&
        william.y < en.y + en.h
      ) {
        const isStomp = william.vy > 0 && prevBottom <= en.y + 16;
        if (isStomp) {
          en.alive = false;
          william.vy = -10.5;
          score += 100;
          playSound("stomp");
          spawnParticles(en.x + en.w / 2, en.y + en.h / 2, "#ff5252", 14, 4.2);
          addFloatingText("+100", en.x, en.y - 5);
        } else if (william.invulnTimer <= 0) {
          if (ringsCollected > 0) {
            scatterRings(william.x + william.width / 2, william.y + 20, ringsCollected);
            ringsCollected = 0;
            william.invulnTimer = 95;
            william.hurtTimer = 24;
            william.vy = -8.5;
            william.vx = (william.x + william.width / 2 < en.x + en.w / 2) ? -5.5 : 5.5;
            playSound("hurt");
            addFloatingText("PERDEU OS ANÉIS!", william.x - 20, william.y - 10, "#ff5252");
          } else {
            gameOver = true;
            playSound("gameover");
          }
        }
      }
    });

    rings.forEach(r => {
      if (r.collected) return;
      let dx = (william.x + william.width / 2) - r.x;
      let dy = (william.y + william.height / 2) - r.y;
      if (Math.hypot(dx, dy) < r.r + william.width / 2) {
        r.collected = true;
        ringsCollected++;
        score += 20;
        playSound("ring");
        spawnParticles(r.x, r.y, "#ffd700", 6, 2.5);
      }
    });

    for (let i = droppedRings.length - 1; i >= 0; i--) {
      const dr = droppedRings[i];
      dr.x += dr.vx * dt;
      dr.y += dr.vy * dt;
      dr.vy += GRAVITY * 0.75 * dt;
      dr.life -= dt;
      if (dr.pickupDelay > 0) dr.pickupDelay -= dt;

      platforms.forEach(p => {
        if (dr.x > p.x && dr.x < p.x + p.w && dr.y + dr.r >= p.y && dr.y - dr.r < p.y + 20 && dr.vy > 0) {
          dr.y = p.y - dr.r;
          dr.vy *= -0.72;
        }
      });

      let dx = (william.x + william.width / 2) - dr.x;
      let dy = (william.y + william.height / 2) - dr.y;
      if (dr.pickupDelay <= 0 && Math.hypot(dx, dy) < dr.r + william.width / 2) {
        ringsCollected++;
        playSound("ring");
        spawnParticles(dr.x, dr.y, "#ffd700", 5, 2);
        droppedRings.splice(i, 1);
        continue;
      }

      if (dr.life <= 0) droppedRings.splice(i, 1);
    }

    if (william.y > canvas.height + 90) {
      gameOver = true;
      playSound("gameover");
    }

    if (william.x + william.width > goal.x) {
      gameWon = true;
      goal.spinSpeed = 0.38;
      playSound("win");
      spawnParticles(goal.x + 25, goal.y + 18, "#ffd700", 25, 5.5);
    }

    const targetCamX = william.x - canvas.width * 0.3;
    camera.x += (targetCamX - camera.x) * 0.12 * dt;
    if (camera.x < 0) camera.x = 0;
  } else {
    endScreenTimer += dt;
    if (goal.spinSpeed > 0) {
      goal.angle += goal.spinSpeed * dt;
      goal.spinSpeed = Math.max(0, goal.spinSpeed - 0.004 * dt);
    }
    if (keys.upJustPressed && endScreenTimer > 30) {
      resetGame(gameWon);
    }
    keys.upJustPressed = false;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= 0.022 * dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  drawBackground(time);
  platforms.forEach(drawPlatform);
  drawSprings();
  drawCheckpoint(time);
  drawRings(time);
  drawEnemies(time);
  drawGoal();
  drawWilliam(ctx, william, time);
  drawParticlesAndTexts();
  drawHUD(time);

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
